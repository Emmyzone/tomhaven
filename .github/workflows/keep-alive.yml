# Supabase free projects pause after about a week with no activity.
# This job reads one product twice a week so the project stays awake.
# Setup: GitHub repo > Settings > Secrets and variables > Actions > add
#   SUPABASE_URL       (same value as VITE_SUPABASE_URL)
#   SUPABASE_ANON_KEY  (same value as VITE_SUPABASE_ANON_KEY)
name: Keep Supabase awake

on:
  schedule:
    - cron: "0 7 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one product
        run: |
          curl --fail --silent --show-error \
            "${{ secrets.SUPABASE_URL }}/rest/v1/products?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"

# Optional: lets Render set up the site automatically from GitHub (Blueprint).
# You can also create the Static Site by hand, see README section 18.
services:
  - type: web
    name: tomhaven
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
